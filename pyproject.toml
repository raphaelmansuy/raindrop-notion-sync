[project]
name = "raindrop-notion-sync"
version = "0.1.0"
description = "Incremental sync of Raindrop.io raindrops into a Notion data source"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
    "tenacity>=8.0",
    "python-dotenv>=1.0",
]

[project.scripts]
raindrop-notion-sync = "raindrop_notion_sync:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
